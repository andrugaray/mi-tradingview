<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi TradingView Exclusivo - Sin Límites</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background-color: #131722;
      font-family: Arial, sans-serif;
      color: #d1d4dc;
      overflow: hidden;
    }
    .header {
      height: 40px;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      font-weight: bold;
      color: #2962ff;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: calc(100vh - 40px);
      gap: 2px;
      background-color: #2a2e39;
    }
    .chart-card {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #131722;
      display: flex;
      flex-direction: column;
    }
    .chart-title {
      position: absolute;
      top: 8px;
      left: 12px;
      z-index: 10;
      font-size: 11px;
      font-weight: bold;
      background: rgba(19, 23, 34, 0.85);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #2a2e39;
      pointer-events: none;
    }
    .chart-container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Librería Oficial de Gráficos Independientes de TradingView -->
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div class="header">
    <span>MI TRADINGVIEW EXCLUSIVO - SIN LÍMITES DE INDICADORES</span>
  </div>

  <div class="grid-container">
    <div class="chart-card">
      <div class="chart-title">BTC/USDT (Sin Límites: Velas + EMA 20 + EMA 50 + EMA 200 + Volumen)</div>
      <div id="chart1" class="chart-container"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">ETH/USDT (Velas + Tiempo Real)</div>
      <div id="chart2" class="chart-container"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">SOL/USDT (Velas + Tiempo Real)</div>
      <div id="chart3" class="chart-container"></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">BNB/USDT (Velas + Tiempo Real)</div>
      <div id="chart4" class="chart-container"></div>
    </div>
  </div>

  <script>
    function crearGraficoCustom(elementId, symbol, intervalBinance) {
      const container = document.getElementById(elementId);
      const chart = LightweightCharts.createChart(container, {
        layout: {
          backgroundColor: '#131722',
          textColor: '#d1d4dc',
        },
        grid: {
          vertLines: { color: '#1f2432' },
          horzLines: { color: '#1f2432' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
        },
        timeScale: {
          timeVisible: true,
          secondsVisible: true,
        },
      });

      // Serie de Velas Japonesas
      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#089981',
        downColor: '#f23645',
        borderDownColor: '#f23645',
        borderUpColor: '#089981',
        wickDownColor: '#f23645',
        wickUpColor: '#089981',
      });

      // Petición del historial de 500 velas pasadas
      const binanceApiUrl = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${intervalBinance}&limit=500`;

      fetch(binanceApiUrl)
        .then(response => response.json())
        .then(data => {
          if (Array.isArray(data)) {
            const cdata = data.map(d => ({
              time: Math.floor(d[0] / 1000), // Convertimos milisegundos a segundos Unix
              open: parseFloat(d[1]),
              high: parseFloat(d[2]),
              low: parseFloat(d[3]),
              close: parseFloat(d[4]),
            }));

            // Carga masiva del historial
            candlestickSeries.setData(cdata);

            // MÚLTIPLES INDICADORES EN EL GRÁFICO 1 (BTC)
            if (elementId === 'chart1') {
              // EMA 20
              const ema20Series = chart.addLineSeries({ color: '#2962ff', lineWidth: 1, title: 'EMA 20' });
              ema20Series.setData(calcularEMA(cdata, 20));

              // EMA 50
              const ema50Series = chart.addLineSeries({ color: '#ffb703', lineWidth: 1, title: 'EMA 50' });
              ema50Series.setData(calcularEMA(cdata, 50));

              // EMA 200
              const ema200Series = chart.addLineSeries({ color: '#f23645', lineWidth: 2, title: 'EMA 200' });
              ema200Series.setData(calcularEMA(cdata, 200));

              // Histogramas de Volumen
              const volumeSeries = chart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: { type: 'volume' },
                priceScaleId: '',
                scaleMargins: { top: 0.8, bottom: 0 },
              });
              const volumeData = data.map(d => ({
                time: Math.floor(d[0] / 1000),
                value: parseFloat(d[5]),
                color: parseFloat(d[4]) >= parseFloat(d[1]) ? '#08998180' : '#f2364580',
              }));
              volumeSeries.setData(volumeData);
            }

            // Auto-encuadrar todo el historial en pantalla
            chart.timeScale().fitContent();
          }
        })
        .catch(err => console.error("Error cargando historial de Binance:", err));

      // CONEXIÓN TIEMPO REAL VÍA WEBSOCKET
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${intervalBinance}`);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        const candle = message.k;
        
        // Actualizamos la vela actual asegurando tiempo en segundos Unix
        candlestickSeries.update({
          time: Math.floor(candle.t / 1000),
          open: parseFloat(candle.o),
          high: parseFloat(candle.h),
          low: parseFloat(candle.l),
          close: parseFloat(candle.c),
        });
      };

      // Redimensionamiento dinámico
      new ResizeObserver(() => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      }).observe(container);
    }

    // Algoritmo para el cálculo de Medias Móviles Exponenciales (EMA)
    function calcularEMA(data, period) {
      const k = 2 / (period + 1);
      let emaArray = [];
      let ema = data[0].close;

      for (let i = 0; i < data.length; i++) {
        ema = data[i].close * k + ema * (1 - k);
        emaArray.push({ time: data[i].time, value: ema });
      }
      return emaArray;
    }

    // Inicializamos las 4 ventanas
    crearGraficoCustom('chart1', 'BTCUSDT', '1m');
    crearGraficoCustom('chart2', 'ETHUSDT', '1m');
    crearGraficoCustom('chart3', 'SOLUSDT', '1m');
    crearGraficoCustom('chart4', 'BNBUSDT', '1m');
  </script>

</body>
</html>
