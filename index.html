<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi TradingView Exclusivo - Sin Límites</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #131722;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }
    .header {
      height: 38px;
      background-color: #1e222d;
      border-bottom: 1px solid #2a2e39;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      color: #2962ff;
      letter-spacing: 0.5px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100vw;
      height: calc(100vh - 38px);
      gap: 2px;
      background-color: #2a2e39;
    }
    .chart-card {
      width: 100%;
      height: 100%;
      background-color: #131722;
      position: relative;
    }
    .tradingview-widget-container {
      width: 100%;
      height: 100%;
    }
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>MI TRADINGVIEW EXCLUSIVO (CONEXIÓN OFICIAL SIN LÍMITES DE HISTORIAL)</span>
  </div>

  <div class="grid-container">
    <!-- Ventana 1: BTC/USDT -->
    <div class="chart-card">
      <div class="tradingview-widget-container">
        <div id="tv_chart_btc" class="tradingview-widget-container__widget"></div>
      </div>
    </div>

    <!-- Ventana 2: ETH/USDT -->
    <div class="chart-card">
      <div class="tradingview-widget-container">
        <div id="tv_chart_eth" class="tradingview-widget-container__widget"></div>
      </div>
    </div>

    <!-- Ventana 3: SOL/USDT -->
    <div class="chart-card">
      <div class="tradingview-widget-container">
        <div id="tv_chart_sol" class="tradingview-widget-container__widget"></div>
      </div>
    </div>

    <!-- Ventana 4: BNB/USDT -->
    <div class="chart-card">
      <div class="tradingview-widget-container">
        <div id="tv_chart_bnb" class="tradingview-widget-container__widget"></div>
      </div>
    </div>
  </div>

  <!-- Script Oficial Widget de TradingView -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    function crearWidget(containerId, symbolPair) {
      new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:" + symbolPair,
        "interval": "1",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "es",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "hide_legend": false,
        "save_image": false,
        "container_id": containerId,
        "studies": [
          "STD;EMA@tv-basicstudies", // EMA 1 (se puede configurar dentro del gráfico)
          "STD;EMA@tv-basicstudies", // EMA 2
          "STD;EMA@tv-basicstudies"  // EMA 3
        ]
      });
    }

    // Carga de las 4 ventanas
    crearWidget("tv_chart_btc", "BTCUSDT");
    crearWidget("tv_chart_eth", "ETHUSDT");
    crearWidget("tv_chart_sol", "SOLUSDT");
    crearWidget("tv_chart_bnb", "BNBUSDT");
  </script>

</body>
</html>
